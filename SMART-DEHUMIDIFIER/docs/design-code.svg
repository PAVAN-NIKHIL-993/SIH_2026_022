66" width="300" height="50" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="210" y="1088" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">supply::engage + door::engage</text><text x="210" y="1104" font-size="13" text-anchor="middle" fill="#1a1a1a">relay = toggle · lock = state</text><rect x="60" y="1128" width="300" height="50" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="210" y="1158" font-size="13" text-anchor="middle" fill="#1a1a1a">dryer.powerOn → IDLE (ready)</text><rect x="420" y="130" width="620" height="40" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="730" y="155" font-size="13" text-anchor="middle" fill="#1a1a1a">② loop() — every pass (cooperative, 0 = DRYER_RTOS)</text><rect x="420" y="182" width="300" height="440" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="570" y="288" font-size="13" text-anchor="middle" fill="#1a1a1a">web::handle — site + captive DNS</text><text x="570" y="305" font-size="13" text-anchor="middle" fill="#1a1a1a">ArduinoOTA.handle — IDE upload</text><text x="570" y="322" font-size="13" text-anchor="middle" fill="#1a1a1a">sensors.update — AHT10 + DHT22 avg</text><text x="570" y="339" font-size="13" text-anchor="middle" fill="#1a1a1a">battery.update — ADC (5 s)</text><text x="570" y="356" font-size="13" text-anchor="middle" fill="#1a1a1a">dryer.tick — control core (1 s)</text><text x="570" y="373" font-size="13" text-anchor="middle" fill="#1a1a1a">keypad.update → menu::key</text><text x="570" y="390" font-size="13" text-anchor="middle" fill="#1a1a1a">scale.update — HX711 (2 Hz)</text><text x="570" y="407" font-size="13" text-anchor="middle" fill="#1a1a1a">door::update — lock/limit workflow</text><text x="570" y="424" font-size="13" text-anchor="middle" fill="#1a1a1a">supply::update — buttons/toggle/opto</text><text x="570" y="441" font-size="13" text-anchor="middle" fill="#1a1a1a">dht.update — DHT11 outdoor (10 s)</text><text x="570" 