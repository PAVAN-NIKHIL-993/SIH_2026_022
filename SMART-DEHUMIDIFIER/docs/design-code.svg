oor limit switch</text><text x="900" y="500" font-size="13" text-anchor="middle" fill="#1a1a1a">DHT11 outdoor sensor</text><text x="900" y="518" font-size="13" text-anchor="middle" fill="#1a1a1a">DS1302 RTC (CR2032 coin cell)</text><text x="900" y="534" font-size="13" text-anchor="middle" fill="#1a1a1a">phone/tablet (web display</text><text x="900" y="552" font-size="13" text-anchor="middle" fill="#1a1a1a">+ full control page)</text><rect x="420" y="640" width="620" height="36" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="730" y="663" font-size="13" text-anchor="middle" fill="#1a1a1a">③ dryer.tick() — the 1-second control core</text><rect x="420" y="692" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="716" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">state machine — IDLE → RUNNING →</text><text x="565" y="734" font-size="13" text-anchor="middle" fill="#1a1a1a">COOLDOWN → DONE / FAULT</text><rect x="420" y="762" width="290" height="56" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="565" y="786" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SAFETY: 95 °C hard cut ·</text><text x="565" y="804" font-size="13" text-anchor="middle" fill="#1a1a1a">sensors dead 15 s → FAULT</text><rect x="420" y="832" width="290" height="56" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="565" y="856" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">WATCHDOGS: heater failure</text><text x="565" y="874" font-size="13" text-anchor="middle" fill="#1a1a1a">(flat 3 min) · fan error (RH 5 min)</text><rect x="420" y="902" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="926" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">heatStep — PID/boost duty</text><text x="565" y="944" font-size="13" text-anchor="middle" fill="#1a1a1a">→ RPWM 12 (BTS7960 → coil)</text><rect x="420" y="972" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="996" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">fanStep — burst law</text><text x="565" y="1014" font-size="13" text-anchor="middle" fill="#1a1a1a">→ ENB 17 (L298N → fan)</text><rect x="420" y="1042" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="1066" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">target weight — T-5 min warn</text><text x="565" y="1084" font-size="13" text-anchor="middle" fill="#1a1a1a">+ suggestion (HX711 g/min)</text><rect x="420" y="1112" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="1136" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">completion gates —</text><text x="565" y="1154" font-size="13" text-anchor="middle" fill="#1a1a1a">time · RH · weight-rate</text><rect x="420" y="1182" width="290" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="565" y="1206" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">cyclelog record (10 s)</text><text x="565" y="1224" font-size="13" text-anchor="middle" fill="#1a1a1a">→ LittleFS CSV (wt_g · mode)</text><rect x="740" y="692" width="300" height="546" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="890" y="876" font-size="13" text-anchor="middle" fill="#1a1a1a">EVENTS INTO THE MACHINE</text><text x="890" y="894" font-size="13" text-anchor="middle" fill="#1a1a1a"></text><text x="890" y="910" font-size="13" text-anchor="middle" fill="#1a1a1a">start() — refused until the scale is</text><text x="890" y="928" font-size="13" text-anchor="middle" fill="#1a1a1a">calibrated (door gate) · captures</text><text x="890" y="944" font-size="13" text-anchor="middle" fill="#1a1a1a">batch weight</text><text x="890" y="962" font-size="13" text-anchor="middle" fill="#1a1a1a">stop() — user stop → purge</text><text x="890" y="978" font-size="13" text-anchor="middle" fill="#1a1a1a">powerOn() — DONE/FAULT → IDLE</text><text x="890" y="996" font-size="13" text-anchor="middle" fill="#1a1a1a">addMinutes(+15) — live</text><text x="890" y="1012" font-size="13" text-anchor="middle" fill="#1a1a1a">applyMode(0/1/2) — AGARBATTI /</text><text x="890" y="1030" font-size="13" text-anchor="middle" fill="#1a1a1a">USER / SILICAGEL presets</text><text x="890" y="1046" font-size="13" text-anchor="middle" fill="#1a1a1a">faultNow("door opened!")</text><text x="890" y="1064" font-size="13" text-anchor="middle" fill="#1a1a1a">setManualHeat(knob %, 60 s)</text><rect x="420" y="1330" width="620" height="150" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="730" y="1384" font-size="13" text-anchor="middle" fill="#1a1a1a">④ web::handle — the website on the hotspot</text><text x="730" y="1402" font-size="13" text-anchor="middle" fill="#1a1a1a">/api/data 1 Hz JSON (everything) · /api/start 403-gated · /api/scale tare+cal</text><text x="730" y="1418" font-size="13" text-anchor="middle" fill="#1a1a1a">/api/mode presets · /api/settime phone clock · /api/heat knob (60 s)</text><text x="730" y="1436" font-size="13" text-anchor="middle" fill="#1a1a1a">/update OTA (refused while RUNNING) · /api/log.csv history · captive DNS</text><rect x="60" y="1330" width="340" height="150" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="230" y="1368" font-size="13" text-anchor="middle" fill="#1a1a1a">DATA FLOW</text><text x="230" y="1384" font-size="13" text-anchor="middle" fill="#1a1a1a">AHT10 → PID → PWM → coil</text><text x="230" y="1402" font-size="13" text-anchor="middle" fill="#1a1a1a">RH → burst law → fan</text><text x="230" y="1418" font-size="13" text-anchor="middle" fill="#1a1a1a">grams → gates + target</text><text x="230" y="1436" font-size="13" text-anchor="middle" fill="#1a1a1a">faults → beep + site + CSV</text><text x