<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><rect width="1080" height="1920" fill="#ffffff"/><line x1="260" y1="103" x2="292" y2="103" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="512" y1="103" x2="544" y2="103" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="764" y1="103" x2="796" y2="103" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="796" y1="130" x2="672" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="224" x2="540" y2="252" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="465" y1="288" x2="333" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="288" x2="540" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="615" y1="288" x2="747" y2="320" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="235" y1="528" x2="390" y2="620" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="270" y1="602" x2="390" y2="650" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="340" y1="683" x2="390" y2="689" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="190" y1="712" x2="190" y2="828" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="862" y1="484" x2="690" y2="605" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="826" y1="568" x2="690" y2="635" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="785" y1="642" x2="690" y2="668" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="690" y1="792" x2="824" y2="866" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="757" y="823" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">hotspot</text><line x1="690" y1="830" x2="854" y2="960" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="772" y="889" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">OTA</text><rect x="40" y="16" width="1000" height="46" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="540" y="36" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SMART DEHUMMIDIFIER PILLAR — FULL SYSTEM DESIGN</text><text x="540" y="52" font-size="13" text-anchor="middle" fill="#1a1a1a">v2.1 max-PCF architecture · one ESP32-S3 does everything</text><rect x="40" y="76" width="220" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="150" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">550 W SOLAR PANEL</text><text x="150" y="116" font-size="13" text-anchor="middle" fill="#1a1a1a">24 V nominal</text><rect x="292" y="76" width="220" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="402" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MPPT CONTROLLER</text><text x="402" y="116" font-size="13" text-anchor="middle" fill="#1a1a1a">20 A+ · 12 V side</text><rect x="544" y="76" width="220" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="654" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">LiFePO4 4S 50–100 Ah</text><text x="654" y="116" font-size="13" text-anchor="middle" fill="#1a1a1a">BMS ≥ 50 A</text><rect x="796" y="76" width="220" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="906" y="100" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">50 A FUSE</text><text x="906" y="116" font-size="13" text-anchor="middle" fill="#1a1a1a">heater rail</text><rect x="380" y="160" width="320" height="64" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="540" y="188" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">P-MOSFET LATCH — hard power-off</text><text x="540" y="206" font-size="13" text-anchor="middle" fill="#1a1a1a">hold = GPIO14 · BUTTON-1: 3 s off / 10 s reboot</text><rect x="200" y="252" width="680" height="36" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="540" y="275" font-size="13" text-anchor="middle" fill="#1a1a1a">12 V POWER BUS</text><rect x="60" y="320" width="280" height="64" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="200" y="340" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BTS7960 43 A + 555 shifter</text><text x="200" y="357" font-size="13" text-anchor="middle" fill="#1a1a1a">RPWM = 12 · EN = 13</text><text x="200" y="374" font-size="13" text-anchor="middle" fill="#1a1a1a">→ 500 W coil (0.32 Ω)</text><rect x="400" y="320" width="280" height="64" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="332" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">L298N</text><text x="540" y="348" font-size="13" text-anchor="middle" fill="#1a1a1a">ENB = 17 (fan PWM)</text><text x="540" y="366" font-size="13" text-anchor="middle" fill="#1a1a1a">IN3/IN4 tied on the module (v2.0.10)</text><text x="540" y="382" font-size="13" text-anchor="middle" fill="#1a1a1a">→ OUTLET fan (burst law)</text><rect x="740" y="320" width="280" height="64" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="880" y="348" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">5 V BUCK (set 5.0 V first)</text><text x="880" y="366" font-size="13" text-anchor="middle" fill="#1a1a1a">→ ESP32 · relays · HX711 · keypad</text><rect x="390" y="430" width="300" height="560" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="562" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ESP32-S3 DevKitC</text><text x="540" y="579" font-size="13" text-anchor="middle" fill="#1a1a1a">(the brain · zero libraries)</text><text x="540" y="596" font-size="13" text-anchor="middle" fill="#1a1a1a"></text><text x="540" y="613" font-size="13" text-anchor="middle" fill="#1a1a1a">BOOT btn = 0 (start/stop)</text><text x="540" y="630" font-size="13" text-anchor="middle" fill="#1a1a1a">latch hold = 14</text><text x="540" y="647" font-size="13" text-anchor="middle" fill="#1a1a1a">I2C0 = 8 / 9 (I2C1 free)</text><text x="540" y="664" font-size="13" text-anchor="middle" fill="#1a1a1a">HX711 = 1 / 2</text><text x="540" y="681" font-size="13" text-anchor="middle" fill="#1a1a1a">battery = ADC 4 · gate 5</text><text x="540" y="698" font-size="13" text-anchor="middle" fill="#1a1a1a">heater = RPWM 12 · EN 13</text><text x="540" y="715" font-size="13" text-anchor="middle" fill="#1a1a1a">fan ENB = 17</text><text x="540" y="732" font-size="13" text-anchor="middle" fill="#1a1a1a">door = 21 · DHT11 = 41</text><text x="540" y="749" font-size="13" text-anchor="middle" fill="#1a1a1a">DHT22 = 10 · opto = 18</text><text x="540" y="766" font-size="13" text-anchor="middle" fill="#1a1a1a">relays = 6 / 7 · toggle = 39</text><text x="540" y="783" font-size="13" text-anchor="middle" fill="#1a1a1a">buttons = 15 / 16</text><text x="540" y="800" font-size="13" text-anchor="middle" fill="#1a1a1a">buzzer = 38 · pixel = 48</text><text x="540" y="817" font-size="13" text-anchor="middle" fill="#1a1a1a">RTC DS1302 = 40 / 42 / 47</text><text x="540" y="834" font-size="13" text-anchor="middle" fill="#1a1a1a"></text><text x="540" y="851" font-size="13" text-anchor="middle" fill="#1a1a1a">(no display — the website</text><text x="540" y="868" font-size="13" text-anchor="middle" fill="#1a1a1a">is the screen, v2.0.7)</text><rect x="40" y="430" width="300" height="34" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="190" y="452" font-size="13" text-anchor="middle" fill="#1a1a1a">I2C0 BUS — GPIO 8 / 9</text><rect x="40" y="474" width="300" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="190" y="498" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">AHT10 (0x38)</text><text x="190" y="514" font-size="13" text-anchor="middle" fill="#1a1a1a">chamber TOP · temp/RH</text><rect x="40" y="538" width="300" height="64" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="190" y="558" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">PCF8574 #1 @ 0x20 — KEYPAD 4×4</text><text x="190" y="575" font-size="13" text-anchor="middle" fill="#1a1a1a">B menu · 2/4/6/8 arrows · A OK</text><text x="190" y="592" font-size="13" text-anchor="middle" fill="#1a1a1a">C mode · D run</text><rect x="40" y="612" width="300" height="100" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="190" y="624" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">PCF8574 #2 @ 0x21 — FRONT PANEL (mixed)</text><text x="190" y="642" font-size="13" text-anchor="middle" fill="#1a1a1a">P0/P1 → supply relay CH1/CH2 (active-LOW)</text><text x="190" y="658" font-size="13" text-anchor="middle" fill="#1a1a1a">P2/P3 → BUTTON-1 / BUTTON-2</text><text x="190" y="676" font-size="13" text-anchor="middle" fill="#1a1a1a">P4 → SOLAR toggle · P5 → opto</text><text x="190" y="692" font-size="13" text-anchor="middle" fill="#1a1a1a">P6 → door limit switch · P7 → buzzer</text><text x="190" y="710" font-size="13" text-anchor="middle" fill="#1a1a1a">(10 kΩ pull-ups on all pins)</text><rect x="40" y="722" width="300" height="94" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="190" y="732" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SPARE S3 GPIOs (no display)</text><text x="190" y="748" font-size="13" text-anchor="middle" fill="#1a1a1a">frees 6 · 7 · 38 · 15 · 16 · 39 · 18 · 21</text><text x="190" y="766" font-size="13" text-anchor="middle" fill="#1a1a1a">after PCF #2 lands</text><text x="190" y="782" font-size="13" text-anchor="middle" fill="#1a1a1a">today free: 3 · 11</text><text x="190" y="800" font-size="13" text-anchor="middle" fill="#1a1a1a">40/42/47 = DS1302 RTC (v2.0.21)</text><text x="190" y="816" font-size="13" text-anchor="middle" fill="#1a1a1a">41 = DHT11 · 48 = pixel · 35/36/37 = R8 PSRAM</text><rect x="40" y="828" width="300" height="110" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="190" y="854" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">DRIVEN VIA PCF #2</text><text x="190" y="871" font-size="13" text-anchor="middle" fill="#1a1a1a">2-CH SUPPLY RELAY — CH1 solar / CH2 bypass</text><text x="190" y="888" font-size="13" text-anchor="middle" fill="#1a1a1a">(never both · switch only with loads quiet)</text><text x="190" y="905" font-size="13" text-anchor="middle" fill="#1a1a1a">BUZZER KY-012 (low-side: + to 3V3)</text><text x="190" y="922" font-size="13" text-anchor="middle" fill="#1a1a1a">BUTTONS / TOGGLE / OPTO / DOOR read back</text><rect x="760" y="430" width="280" height="54" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="900" y="445" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">DHT22 · cool-return path</text><text x="900" y="462" font-size="13" text-anchor="middle" fill="#1a1a1a">GPIO10 + 10k · chamber source #2</text><text x="900" y="479" font-size="13" text-anchor="middle" fill="#1a1a1a">(I2C1 free, GPIO11 spare)</text><rect x="760" y="494" width="280" height="74" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="900" y="519" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">HX711 + 2×5 kg load cells</text><text x="900" y="536" font-size="13" text-anchor="middle" fill="#1a1a1a">CLK = 1 · DOUT = 2 · dry-to-weight</text><text x="900" y="553" font-size="13" text-anchor="middle" fill="#1a1a1a">cells OUTSIDE the hot chamber</text><rect x="760" y="578" width="280" height="64" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="900" y="598" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BATTERY DIVIDER</text><text x="900" y="615" font-size="13" text-anchor="middle" fill="#1a1a1a">100k / 15k → ADC 4</text><text x="900" y="632" font-size="13" text-anchor="middle" fill="#1a1a1a">gate = GPIO5 (2N7000)</text><rect x="760" y="866" width="280" height="84" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="900" y="888" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ANY PHONE (browser only)</text><text x="900" y="904" font-size="13" text-anchor="middle" fill="#1a1a1a">WiFi AgarbattiDryer / dryer1234</text><text x="900" y="922" font-size="13" text-anchor="middle" fill="#1a1a1a">http://192.168.4.1</text><text x="900" y="938" font-size="13" text-anchor="middle" fill="#1a1a1a">dashboard · parameters · history</text><rect x="760" y="960" width="280" height="74" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="900" y="976" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">PC — Arduino IDE</text><text x="900" y="994" font-size="13" text-anchor="middle" fill="#1a1a1a">network OTA:</text><text x="900" y="1010" font-size="13" text-anchor="middle" fill="#1a1a1a">smart-dryer at 192.168.4.1</text><text x="900" y="1028" font-size="13" text-anchor="middle" fill="#1a1a1a">or USB serial 115200</text><rect x="40" y="1140" width="1000" height="130" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="540" y="1184" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SAFETY CHAIN — always armed</text><text x="540" y="1202" font-size="13" text-anchor="middle" fill="#1a1a1a">95 °C hard cut · both sensors dead 15 s · heater failure (temp flat 3 min) · fan error (RH ≥ 60 % for 5 min)</text><text x="540" y="1218" font-size="13" text-anchor="middle" fill="#1a1a1a">door opened mid-cycle = instant FAULT · battery ≤ 10 % safe shutdown · purge before every power cut</text><text x="540" y="1236" font-size="13" text-anchor="middle" fill="#1a1a1a">OTA refused while RUNNING · START refused until the scale is calibrated · unused pins parked safe</text><rect x="40" y="1290" width="480" height="80" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="280" y="1318" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MODES — C key / BUTTON-2 / website</text><text x="280" y="1335" font-size="13" text-anchor="middle" fill="#1a1a1a">AGARBATTI 60 °C · USER DEFINED · SILICAGEL 80 °C</text><text x="280" y="1352" font-size="13" text-anchor="middle" fill="#1a1a1a">setTemp clamped 40–80 °C (hard cut 95 °C)</text><rect x="560" y="1290" width="480" height="80" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="800" y="1318" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BEEP LANGUAGE</text><text x="800" y="1335" font-size="13" text-anchor="middle" fill="#1a1a1a">start 3 s · end 5 s · power-on 2/s × 3 s</text><text x="800" y="1352" font-size="13" text-anchor="middle" fill="#1a1a1a">error 5 s · door 1 s · mode change 3 s</text><rect x="40" y="1390" width="1000" height="150" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="540" y="1428" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BUILD NOTES</text><text x="540" y="1444" font-size="13" text-anchor="middle" fill="#1a1a1a">• Buy PCF8574 — never PCF8574A (0x38 = AHT10 clash) · addresses 0x20 / 0x21 / 0x22 · AT24C256 0x50 (cycle registry)</text><text x="540" y="1462" font-size="13" text-anchor="middle" fill="#1a1a1a">• DevKitC N8/N16/N16R8 all work — pin map avoids GPIO 35/36/37 (PSRAM on R8)</text><text x="540" y="1478" font-size="13" text-anchor="middle" fill="#1a1a1a">• All grounds common at ONE star point · buck set to 5.0 V before the ESP32 connects</text><text x="540" y="1496" font-size="13" text-anchor="middle" fill="#1a1a1a">• Battery gate (GPIO5), latch hold (14), RPWM (12), ADC (4), HX711 (1/2) stay DIRECT on the S3 —</text><text x="540" y="1512" font-size="13" text-anchor="middle" fill="#1a1a1a">  everything slow (clicks, beeps, switches, presses) lives on the PCFs</text><rect x="40" y="1560" width="1000" height="44" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="540" y="1587" font-size="13" text-anchor="middle" fill="#1a1a1a">OPERATING WORKFLOW  (power-on → calibrate → load → dry → done)  →  PAGE 2 of this file</text></svg>