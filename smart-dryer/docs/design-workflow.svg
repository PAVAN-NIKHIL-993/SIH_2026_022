<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><rect width="1080" height="1920" fill="#ffffff"/><line x1="540" y1="86" x2="540" y2="112" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="168" x2="540" y2="194" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="266" x2="540" y2="292" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="348" x2="540" y2="374" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="410" y1="429" x2="340" y2="429" stroke="#d79b00" stroke-width="2" marker-end="url(#arr)"/><text x="375" y="423" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">NO</text><line x1="340" y1="429" x2="410" y2="429" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="375" y="423" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">done ✓</text><line x1="540" y1="484" x2="540" y2="516" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="494" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">YES</text><line x1="540" y1="572" x2="540" y2="598" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="670" x2="540" y2="696" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="752" x2="540" y2="778" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="850" x2="540" y2="880" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="936" x2="540" y2="962" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="1018" x2="540" y2="1044" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><polyline points="410,1094 372,1094 372,814 390,814" fill="none" stroke="#d79b00" stroke-width="2" marker-end="url(#arr)"/><text x="372" y="948" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">no — keep drying</text><line x1="390" y1="836" x2="340" y2="843" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/><text x="365" y="833" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">any fault</text><polyline points="60,863 28,863 28,1440 390,1440" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="6 4"/><text x="28" y="1146" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">purge → power off</text><line x1="540" y1="1144" x2="540" y2="1176" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="1154" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">YES</text><line x1="540" y1="1286" x2="540" y2="1322" stroke="#82b366" stroke-width="2" marker-end="url(#arr)"/><text x="540" y="1298" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">YES</text><line x1="670" y1="1279" x2="785" y2="1322" stroke="#d79b00" stroke-width="2" marker-end="url(#arr)"/><text x="727" y="1295" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">NO</text><line x1="540" y1="1378" x2="540" y2="1404" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="760" y1="1378" x2="668" y2="1404" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><line x1="540" y1="1476" x2="540" y2="1502" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><polyline points="390,1530 352,1530 352,544 390,544" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arr)"/><text x="352" y="1031" font-size="12" text-anchor="middle" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke">reload trays</text><rect x="390" y="30" width="300" height="56" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="540" y="54" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">POWER ON — press BUTTON-1</text><text x="540" y="72" font-size="13" text-anchor="middle" fill="#1a1a1a">P-MOSFET latch feeds the pillar</text><rect x="390" y="112" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="136" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ALL PINS LOW</text><text x="540" y="154" font-size="13" text-anchor="middle" fill="#1a1a1a">outputs safe · unused pads parked</text><rect x="390" y="194" width="300" height="72" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="218" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">SPLASH + POWER-ON BEEPS</text><text x="540" y="235" font-size="13" text-anchor="middle" fill="#1a1a1a">SELF-TEST [diag]</text><text x="540" y="252" font-size="13" text-anchor="middle" fill="#1a1a1a">10 s INIT + CALIBRATION window</text><rect x="390" y="292" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="316" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">ENGAGE — supply relay = toggle</text><text x="540" y="334" font-size="13" text-anchor="middle" fill="#1a1a1a">(start gate per calibration state)</text><polygon points="540.0,374 670,429.0 540.0,484 410,429.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="540" y="426" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">scale</text><text x="540" y="442" font-size="13" text-anchor="middle" fill="#1a1a1a">calibrated?</text><rect x="60" y="384" width="280" height="90" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="200" y="417" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">START LOCKED — CALIBRATE</text><text x="200" y="434" font-size="13" text-anchor="middle" fill="#1a1a1a">tare, then known weight (e.g. 1000 g)</text><text x="200" y="451" font-size="13" text-anchor="middle" fill="#1a1a1a">website Calibrate / serial cal 1000</text><rect x="390" y="516" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="540" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">GATE OPEN — LOAD THE TRAYS</text><text x="540" y="558" font-size="13" text-anchor="middle" fill="#1a1a1a">then CLOSE the door</text><rect x="390" y="598" width="300" height="72" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="622" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BATCH WEIGHED (diff vs tare)</text><text x="540" y="639" font-size="13" text-anchor="middle" fill="#1a1a1a">READY: n g on screen + site</text><text x="540" y="656" font-size="13" text-anchor="middle" fill="#1a1a1a">(empty / overload warned)</text><rect x="390" y="696" width="300" height="56" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="540" y="720" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">START — D key · website ·</text><text x="540" y="738" font-size="13" text-anchor="middle" fill="#1a1a1a">BUTTON-2 · BOOT button</text><rect x="390" y="778" width="300" height="72" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="802" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">RUNNING — OPEN DOOR = FAULT</text><text x="540" y="819" font-size="13" text-anchor="middle" fill="#1a1a1a">full-power heat-up → PID hold</text><text x="540" y="836" font-size="13" text-anchor="middle" fill="#1a1a1a">setTemp 40–80 °C</text><rect x="390" y="880" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="904" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">FAN BURST LAW</text><text x="540" y="922" font-size="13" text-anchor="middle" fill="#1a1a1a">RH ≥ 60 % for 1 min → fan 100 % for 60 s</text><rect x="390" y="962" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="986" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">TARGET WEIGHT</text><text x="540" y="1004" font-size="13" text-anchor="middle" fill="#1a1a1a">cur / tgt / diff live · warn at T-5 min</text><rect x="60" y="778" width="280" height="170" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="200" y="817" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">FAULTS — beep 5 s</text><text x="200" y="834" font-size="13" text-anchor="middle" fill="#1a1a1a">95 °C cut</text><text x="200" y="851" font-size="13" text-anchor="middle" fill="#1a1a1a">heater failure (flat 3 min)</text><text x="200" y="868" font-size="13" text-anchor="middle" fill="#1a1a1a">fan error (RH ≥ 60 % 5 min)</text><text x="200" y="885" font-size="13" text-anchor="middle" fill="#1a1a1a">door opened mid-cycle</text><text x="200" y="902" font-size="13" text-anchor="middle" fill="#1a1a1a">both sensors dead</text><text x="200" y="919" font-size="13" text-anchor="middle" fill="#1a1a1a">battery ≤ 10 %</text><polygon points="540.0,1044 670,1094.0 540.0,1144 410,1094.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="540" y="1099" font-size="13" text-anchor="middle" fill="#1a1a1a">time up?</text><polygon points="540.0,1176 670,1231.0 540.0,1286 410,1231.0" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="540" y="1228" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">within 5 %</text><text x="540" y="1244" font-size="13" text-anchor="middle" fill="#1a1a1a">of target?</text><rect x="390" y="1322" width="300" height="56" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="540" y="1355" font-size="13" text-anchor="middle" fill="#1a1a1a">DONE — purge 45 s (fan 100 %)</text><rect x="700" y="1322" width="320" height="56" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="860" y="1346" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">DONE-WITH-WARNING — target missed</text><text x="860" y="1364" font-size="13" text-anchor="middle" fill="#1a1a1a">flag on site/CSV + warn beep</text><rect x="390" y="1404" width="300" height="72" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="1436" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">POWER CUT (relay) · UNLOCK</text><text x="540" y="1454" font-size="13" text-anchor="middle" fill="#1a1a1a">UNLOAD — CSV saved (wt_g · mode · target)</text><rect x="390" y="1502" width="300" height="56" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="540" y="1535" font-size="13" text-anchor="middle" fill="#1a1a1a">NEXT BATCH — door already unlocked</text><rect x="60" y="1600" width="960" height="90" rx="10" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="540" y="1642" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">BUTTON-1: hold 3 s = HARD OFF (latch drops) · hold 10 s = REBOOT</text><text x="540" y="1658" font-size="13" text-anchor="middle" fill="#1a1a1a">FIRMWARE UPDATE: website → Firmware update (.bin)  or  Arduino IDE → smart-dryer at 192.168.4.1 — refused while RUNNING</text><rect x="60" y="1710" width="960" height="56" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="540" y="1743" font-size="13" text-anchor="middle" fill="#1a1a1a">MODES: AGARBATTI 60 °C (default) · USER DEFINED · SILICAGEL 80 °C — cycle with the C key / website / BUTTON-2</text></svg>