; Smart DeHummidifier - ESP32 firmware (zero external libraries!)
; Build:   pio run          (PlatformIO, https://platformio.org)
; Upload:  pio run -t upload && pio device monitor
;
; Arduino IDE users: open arduino-ide/smart-dryer-single-file/
; smart-dryer-single-file.ino - one file, whole project, no libraries.

[env:esp32dev]
platform = espressif32
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=1