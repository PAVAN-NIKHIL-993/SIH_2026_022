<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0369a1"/>
    </marker>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5;rx:10}
    .ttl{font-size:14px;font-weight:700;fill:#0f172a}
    .sub{font-size:11px;fill:#475569}
    .pin{font-size:11px;font-weight:700;fill:#0f172a}
    .lbl{font-size:11px;fill:#475569}
    .wire{stroke:#0369a1;stroke-width:2;fill:none}
    .power{stroke:#b45309;stroke-width:3;fill:none}
  </style>

  <rect x="0" y="0" width="1120" height="790" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="800" fill="#0f172a">Smart Dehumidifier — wiring overview</text>
  <text x="20" y="48" class="sub">all grounds common · solar panel → BMS → battery → BMS out · relay cuts power at end of cycle</text>

  <!-- ================= ESP32 ================= -->
  <!-- ================= ESP32 ================= -->
  <rect class="box" x="470" y="150" width="220" height="330" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="ttl" x="580" y="176" text-anchor="middle">ESP32 DevKit V1</text>

  <!-- left pins -->
  <text class="pin" x="480" y="222">GPIO21/22 · Wire</text>
  <text class="pin" x="480" y="286">GPIO32/33 · Wire1</text>
  <text class="pin" x="480" y="352">GPIO36 (ADC1)</text>
  <text class="pin" x="480" y="396">GPIO19</text>
  <text class="pin" x="480" y="452">GPIO2</text>

  <!-- right pins -->
  <text class="pin" x="680" y="232" text-anchor="end">GPIO25 · 555 → RPWM</text>
  <text class="pin" x="680" y="250" text-anchor="end">LPWM → GND (tied)</text>
  <text class="pin" x="680" y="268" text-anchor="end">GPIO27 · R_EN+L_EN</text>
  <text class="pin" x="680" y="340" text-anchor="end">GPIO16 · ENA</text>
  <text class="pin" x="680" y="358" text-anchor="end">GPIO17/18 · IN1/IN2</text>
  <text class="pin" x="680" y="376" text-anchor="end">GPIO14 · ENB</text>
  <text class="pin" x="680" y="394" text-anchor="end">GPIO13/4 · IN3/IN4</text>
  <text class="pin" x="680" y="452" text-anchor="end">GPIO23 → relay IN</text>
  <text class="pin" x="680" y="452" text-anchor="end">GPIO23 → relay IN</text>

  <!-- ================= AHT10 sensors ================= -->
  <rect class="box" x="200" y="196" width="170" height="48" rx="10" fill="#f5f3ff" stroke="#6d28d9"/>
  <text class="ttl" x="285" y="216" text-anchor="middle">AHT10 #1 — top</text>
  <text class="sub" x="285" y="232" text-anchor="middle">0x38 · SDA/SCL</text>
  <rect class="box" x="200" y="260" width="170" height="48" rx="10" fill="#f5f3ff" stroke="#6d28d9"/>
  <text class="ttl" x="285" y="280" text-anchor="middle">AHT10 #2 — bottom</text>
  <text class="sub" x="285" y="296" text-anchor="middle">second bus (fixed addr!)</text>
  <path class="i2c" d="M370,220 H470" marker-end="url(#arrI)"/>
  <path class="i2c" d="M370,284 H470" marker-end="url(#arrI)"/>

  <!-- ================= Battery divider detail ================= -->
  <rect class="box" x="150" y="330" width="290" height="130" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text class="ttl" x="295" y="352" text-anchor="middle">Battery sense (transistor pull-down)</text>
  <text style="font-size:12px;fill:#78350f" x="170" y="378">BAT+ ──[100k]──┬──> GPIO36</text>
  <text style="font-size:12px;fill:#78350f" x="186" y="396">[15k] │</text>
  <text style="font-size:12px;fill:#78350f" x="186" y="414">GATE◄─ GPIO19 (2N7000)</text>
  <text style="font-size:12px;fill:#78350f" x="186" y="432">S→GND · D→divider bottom</text>
  <text class="sub" x="295" y="450" text-anchor="middle">ratio (100+15)/15 = 7.667 → 16.8 V ≈ 2.19 V at ADC</text>
  <path class="wire" d="M440,362 H470" marker-end="url(#arrS)"/>
  <path class="wire" d="M440,390 H470" marker-end="url(#arrS)"/>

  <!-- ================= Power path ================= -->
  <rect class="box" x="20" y="80" width="150" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text class="ttl" x="95" y="108" text-anchor="middle">Solar panel</text>
  <text class="sub" x="95" y="126" text-anchor="middle">18 V PV in</text>

  <rect class="box" x="230" y="80" width="130" height="70" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text class="ttl" x="295" y="108" text-anchor="middle">BMS</text>
  <text class="sub" x="295" y="126" text-anchor="middle">charge / protect</text>

  <rect class="box" x="230" y="190" width="130" height="60" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text class="ttl" x="295" y="215" text-anchor="middle">Battery</text>
  <text class="sub" x="295" y="232" text-anchor="middle">3S/4S/SLA</text>
  <path class="power" d="M295,150 V190" marker-end="url(#arrP)"/>

  <path class="power" d="M170,115 H230" marker-end="url(#arrP)"/>
  <path class="power" d="M360,100 H430" marker-end="url(#arrP)"/>
  <text class="lbl" x="380" y="92">BMS OUT</text>

  <!-- Load relay -->
  <rect class="box" x="430" y="66" width="170" height="68" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text class="ttl" x="515" y="92" text-anchor="middle">LOAD RELAY</text>
  <text class="sub" x="515" y="110" text-anchor="middle">opens = power cut at end</text>
  <path class="wire" d="M688,448 H695 V120 H604" marker-end="url(#arrS)" fill="none"/>

  <!-- 12V rail to drivers -->
  <path class="power" d="M600,100 H700 V160" marker-end="url(#arrP)"/>
  <path class="power" d="M650,100 H700 V370" marker-end="url(#arrP)"/>

  <!-- ================= BTS7960 ================= -->
  <rect class="box" x="700" y="150" width="180" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text class="ttl" x="790" y="176" text-anchor="middle">BTS7960 43 A</text>
  <text class="sub" x="790" y="194" text-anchor="middle">B+/B− ← relay rail</text>
  <text class="sub" x="790" y="212" text-anchor="middle">M+/M− → heating coil</text>
  <text class="sub" x="790" y="230" text-anchor="middle">PWM duty = PID output,</text>
  <text class="sub" x="790" y="248" text-anchor="middle">holds chamber at set temp</text>
  <text class="sub" x="790" y="272" text-anchor="middle">VCC 5 V · GND common</text>
  <path class="wire" d="M690,232 H700" marker-end="url(#arrS)"/>
  <path class="wire" d="M690,250 H700" marker-end="url(#arrS)"/>
  <path class="wire" d="M690,268 H700" marker-end="url(#arrS)"/>

  <!-- coil -->
  <rect class="box" x="940" y="180" width="150" height="80" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text class="ttl" x="1015" y="210" text-anchor="middle">Heating coil</text>
  <text class="sub" x="1015" y="228" text-anchor="middle">inside chamber</text>
  <path class="power" d="M880,220 H940" marker-end="url(#arrP)"/>

  <!-- ================= L298N ================= -->
  <rect class="box" x="700" y="320" width="180" height="160" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="ttl" x="790" y="346" text-anchor="middle">L298N</text>
  <text class="sub" x="790" y="364" text-anchor="middle">12 V from relay rail</text>
  <text class="sub" x="790" y="382" text-anchor="middle">ENA/ENB PWM = speed</text>
  <text class="sub" x="790" y="400" text-anchor="middle">fan law follows RH band</text>
  <text class="sub" x="790" y="418" text-anchor="middle">(remove EN jumpers)</text>
  <text class="sub" x="790" y="442" text-anchor="middle">GND common</text>
  <path class="wire" d="M690,334 H700" marker-end="url(#arrS)"/>
  <path class="wire" d="M690,352 H700" marker-end="url(#arrS)"/>
  <path class="wire" d="M690,370 H700" marker-end="url(#arrS)"/>
  <path class="wire" d="M690,388 H700" marker-end="url(#arrS)"/>

  <!-- fans -->
  <rect class="box" x="940" y="320" width="150" height="70" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text class="ttl" x="1015" y="348" text-anchor="middle">Intake fan</text>
  <text class="sub" x="1015" y="366" text-anchor="middle">OUT1/OUT2</text>
  <path class="power" d="M880,355 H940" marker-end="url(#arrP)"/>
  <rect class="box" x="940" y="410" width="150" height="70" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text class="ttl" x="1015" y="438" text-anchor="middle">Exhaust fan</text>
  <text class="sub" x="1015" y="456" text-anchor="middle">OUT3/OUT4</text>
  <path class="power" d="M880,445 H940" marker-end="url(#arrP)"/>

  <!-- ================= Bypass ================= -->
  <rect class="box" x="150" y="560" width="330" height="110" rx="10" fill="#ecfeff" stroke="#0891b2"/>
  <text class="ttl" x="315" y="584" text-anchor="middle">BYPASS MODE</text>
  <text class="sub" x="315" y="606" text-anchor="middle">battery ≤ bypass% (default 20 %) → GPIO2 energises</text>
  <text class="sub" x="315" y="624" text-anchor="middle">bypass relay/contactor around the BMS output;</text>
  <text class="sub" x="315" y="642" text-anchor="middle">website shows battery % + BYPASS badge</text>
  <text class="sub" x="315" y="660" text-anchor="middle">battery ≤ cutoff% (10 %) → safe power cut</text>
  <path class="wire" d="M470,452 H455 V560" marker-end="url(#arrS)"/>

  <!-- ================= Chamber ================= -->
  <rect class="box" x="560" y="560" width="330" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="ttl" x="725" y="584" text-anchor="middle">Drying chamber (agarbatti racks)</text>
  <text class="sub" x="725" y="606" text-anchor="middle">AHT10 top + bottom · PID holds set temp (default 45 °C)</text>
  <text class="sub" x="725" y="624" text-anchor="middle">fans vent when RH &gt; band, stop when RH &lt; band</text>
  <text class="sub" x="725" y="642" text-anchor="middle">cycle: manual time → purge → relay cuts power</text>

  <!-- ================= Buzzer (mandatory) ================= -->
  <rect class="box" x="470" y="492" width="220" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text class="ttl" x="580" y="513" text-anchor="middle">BUZZER (mandatory)</text>
  <text class="sub" x="580" y="531" text-anchor="middle">KY-012 &#8594; GPIO15 &#183; start/stop/done/fault beeps</text>
  <path class="wire" d="M580,480 V492" marker-end="url(#arrS)"/>

  <!-- ================= Optional add-ons ================= -->
  <rect class="box" x="920" y="560" width="190" height="110" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-dasharray="6 4"/>
  <text class="ttl" x="1015" y="582" text-anchor="middle">Optional add-ons</text>
  <text class="sub" x="1015" y="602" text-anchor="middle">DHT22 outdoor &#8594; GPIO5 (+10k PU)</text>
  <text class="sub" x="1015" y="620" text-anchor="middle">hex keypad &#8594; PCF8574 @0x20 on 21/22</text>
  <text class="sub" x="1015" y="638" text-anchor="middle">unwired = firmware skips them</text>

  <!-- legend -->
  <g transform="translate(20,700)">
    <line x1="0" y1="10" x2="40" y2="10" class="power"/><text class="lbl" x="46" y="14">power path</text>
    <line x1="150" y1="10" x2="190" y2="10" class="wire"/><text class="lbl" x="196" y="14">control signals</text>
    <line x1="310" y1="10" x2="350" y2="10" class="i2c"/><text class="lbl" x="356" y="14">I2C (two buses — AHT10 addr is fixed)</text>
    <text class="lbl" x="760" y="14" fill="#dc2626">red box = safety power cut</text>
  </g>
</svg>