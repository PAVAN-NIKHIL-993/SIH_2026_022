# Deploys the online dryer UI (SMART-DEHUMIDIFIER/docs/index.html) to GitHub Pages.
# Site: https://pavan-nikhil-993.github.io/SIH_2026_022/
#       (must match ONLINE_UI_URL in src/config.h + variants/esp32-s3/config-s3.h)
# One-time repo setting: Settings -> Pages -> Build and deployment ->
#   Source: "GitHub Actions". Until that is set, the preflight job SKIPS the
#   deploy with a notice instead of failing every push to main.
name: Deploy online UI to Pages

on:
  push:
    branches: [main]
    paths: ['SMART-DEHUMIDIFIER/docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a production deployment off halfway

jobs:
  preflight:
    name: Pages enabled?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled::Settings -> Pages -> Source: GitHub Actions, then re-run this workflow. Deploy skipped."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: SMART-DEHUMIDIFIER/docs      # index.html served at the site root
      - uses: actions/deploy-pages@v5
        id: deployment
