# Deploys the online dryer UI (smart-dryer/docs/index.html) to GitHub Pages.
# Site: https://pavan-nikhil-993.github.io/arena/   (must match ONLINE_UI_URL)
# Repo Settings -> Pages -> Source: GitHub Actions
name: Deploy online UI to Pages

on:
  push:
    branches: [main]
    paths: ['smart-dryer/docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: smart-dryer/docs      # index.html served at the site root
      - uses: actions/deploy-pages@v4
        id: deployment